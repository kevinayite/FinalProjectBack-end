spring.application.name=PANORAMIC Universal Vision Platform

# PostgreSQL Datasource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/panoramic_database
spring.datasource.username=postgres
spring.datasource.password=java123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=mySecretKey123456789012345678901234567890
jwt.expiration=86400000

# Server Configuration
server.port=8080

# Logging Configuration
logging.level.com.panoramic=DEBUG
logging.level.org.springframework.security=DEBUG

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=./uploads/employees-documents

# Application Configuration
app.name=Panoramic Management System
app.version=1.0.0

# Include error messages and stack traces in logs and API responses
server.error.include-message=always
server.error.include-exception=true
server.error.include-binding-errors=always


spring.datasource.hikari.auto-commit=false

